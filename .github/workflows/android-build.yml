name: Build Android APK

# Replaces the old Median.co wrapping step. This builds the PWA into a real
# Android APK on GitHub's own servers, fresh on every run — nothing about
# the Android project (the android/ folder, gradle files, etc.) is
# committed to the repo; it's generated here each time by `npx cap add
# android`, so there's nothing locally-generated to go stale or drift out
# of sync with the web app.
#
# The one exception is android-debug.keystore (repo root) — see the "Install
# the stable debug signing key" step below for why that one file IS
# committed: without it, every fresh runner gets its own random debug
# signing key and every build becomes un-installable over the last one.
#
# Triggers:
#   - every push to main that touches the app itself (not docs/screenshots)
#   - manually, any time, via the "Run workflow" button on the Actions tab
#   - pushing a version tag (v1.5.0 etc.) additionally publishes a GitHub
#     Release with the APK attached, so there's a permanent download link
#     instead of only the 90-day build artifact

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'manifest.json'
      - 'service-worker.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'android-debug.keystore'
      - 'icon-source/**'
      - '.github/workflows/android-build.yml'
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java (required by Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: npm install

      - name: Assemble the web assets Capacitor will bundle
        # Capacitor expects a single "webDir" folder (configured as "www" in
        # capacitor.config.json) to copy into the native app. The live
        # GitHub Pages site keeps serving straight from the repo root, as
        # before — this copy only exists inside the CI run, never committed.
        run: |
          rm -rf www
          mkdir -p www
          cp -r index.html css js assets manifest.json service-worker.js www/

      - name: Generate the Android project
        run: npx cap add android

      - name: Generate the app icon
        # cap add android scaffolds the Android project from Capacitor's own
        # generic template, including its generic blue "C" launcher icon —
        # and since android/ is never committed (regenerated fresh every
        # run, see the note at the top of this file), that default icon is
        # what you get back on every build unless something re-applies the
        # real one here, each time. icon-source/ (committed in the repo)
        # holds the actual Bersales Secure artwork; this renders it into every
        # density bucket Android needs (android/app/src/main/res/mipmap-*)
        # and wires up the adaptive-icon foreground/background layers.
        run: npx @capacitor/assets generate --android --assetPath icon-source

      - name: Add the camera permission to the Android manifest
        # `cap add android` generates a fresh AndroidManifest.xml every run
        # (it's not committed — see the note at the top of this file), and
        # Capacitor's default template does NOT request the camera, since
        # there's no native camera plugin in this app (js/scanner.js calls
        # the browser's own getUserMedia() inside the webview instead). With
        # no <uses-permission> for the camera, Android has nothing to grant —
        # that's why Settings > App info shows "No permissions required" and
        # the in-app scanner gets "Camera access was denied or unavailable"
        # on every device, every time. Capacitor's WebView bridge already
        # forwards getUserMedia() camera requests to Android's native runtime
        # permission prompt automatically — it just needs the permission
        # declared here to have something to forward.
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Install the stable debug signing key
        # Without this, assembleDebug finds no keystore at ~/.android/debug.keystore
        # on this fresh runner and has Gradle generate a brand-new random one on
        # the spot — so every CI build was signed by a different key, which is
        # why installs were failing with "App not installed" (Android refuses to
        # install an "update" signed by a different key than what's already on
        # the phone) and Play Protect was flagging every build as an unrecognized
        # developer. android-debug.keystore is committed in the repo root (not a
        # secret — it's a debug-only key with Android's standard public
        # "android"/"android" passwords, never used for a Play Store release) so
        # every build, on every run, signs with the same key and installs as a
        # normal update over the last one.
        run: |
          mkdir -p ~/.android
          cp android-debug.keystore ~/.android/debug.keystore

      - name: Verify the signing key actually took (fail loudly, not silently)
        # Added after discovering the committed android-debug.keystore had
        # gone bad (likely corrupted on its very first upload) and every
        # build since had been SILENTLY falling back to a brand-new random
        # debug key per run — Gradle doesn't error when ~/.android/debug.keystore
        # is invalid, it just regenerates one on the spot. That meant every
        # "update" was actually signed differently from the last, so Android
        # refused to install over the existing app ("App not installed"),
        # every single time, with no hint in this log that anything was
        # wrong — the build always showed green. This step reads the key
        # back with the same keytool Android itself will later check
        # against, and fails the whole run if it can't, specifically so a
        # bad keystore shows up as a red X here instead of as a confusing
        # install failure on someone's phone days later. The fingerprint is
        # also printed on every successful run — if it ever differs from
        # the previous run's log, that's this same problem recurring.
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
            || { echo "::error::android-debug.keystore in the repo is missing, corrupted, or doesn't contain the expected 'androiddebugkey' alias — every build until this is fixed will silently sign with a throwaway random key, and installs will keep failing with 'App not installed'. Re-commit a valid debug keystore at the repo root (same path, same androiddebugkey alias, same android/android store+key passwords) and re-run."; exit 1; }

      - name: Build the debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename the APK to BersalesSecure.apk
        # Gradle always names its raw output app-debug.apk (that's the debug
        # build variant's default name, not something this workflow controls
        # directly) — so without this step, that generic name is what you'd
        # see both in the downloaded artifact and once it lands on the phone.
        # Renaming it here is what makes the file itself read "BersalesSecure".
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/BersalesSecure.apk

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BersalesSecure-apk
          path: android/app/build/outputs/apk/debug/BersalesSecure.apk
          retention-days: 90

      - name: Publish a GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/BersalesSecure.apk
          generate_release_notes: true

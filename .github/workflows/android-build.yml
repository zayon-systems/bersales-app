name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'manifest.json'
      - 'service-worker.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'resources/**'
      - '.github/workflows/android-build.yml'
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java (required by Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: npm install

      - name: Assemble the web assets Capacitor will bundle
        run: |
          rm -rf www
          mkdir -p www
          cp -r index.html css js assets manifest.json service-worker.js www/

      - name: Generate the Android project
        run: npx cap add android

      - name: Generate the branded app icon
        run: npx capacitor-assets generate --android

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build the debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename the APK to something recognizable
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Bersales-debug.apk

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bersales-debug-apk
          path: android/app/build/outputs/apk/debug/Bersales-debug.apk
          retention-days: 90

      - name: Publish a GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/Bersales-debug.apk
          generate_release_notes: true
